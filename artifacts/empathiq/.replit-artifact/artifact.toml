kind = "web"
previewPath = "/"
title = "EmpathIQ"
version = "1.0.0"
id = "artifacts/empathiq"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18093

[services.development]
run = "pnpm --filter @workspace/empathiq run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/empathiq", "run", "build" ]
publicDir = "artifacts/empathiq/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18093"
BASE_PATH = "/"
